<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laboratorio de Síntesis Orgánica</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .fade-in { animation: fadeIn 0.4s ease-in; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .reagents-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 0.75rem; }
        .shake { animation: shake 0.5s; }
        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            50% { transform: translateX(5px); }
            75% { transform: translateX(-5px); }
            100% { transform: translateX(0); }
        }
        .shadow-soft { box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1); }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col font-sans text-slate-800">

    <header class="bg-emerald-700 text-white shadow-md sticky top-0 z-10">
        <div class="max-w-5xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-2xl font-bold flex items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 2v7.31"/><path d="M14 9.3V1.99"/><path d="M8.5 2h7"/><path d="M14 9.3a6.5 6.5 0 1 1-4 0"/><path d="M5.52 16h12.96"/></svg>
                Laboratorio de Síntesis: Química II
            </h1>
            <span class="bg-emerald-800 px-3 py-1 rounded-full text-sm font-semibold border border-emerald-600">
                20 Retos Disponibles
            </span>
        </div>
    </header>

    <div class="max-w-5xl w-full mx-auto px-4 py-8 flex-grow flex flex-col">
        
        <div id="syn-menu-view" class="flex flex-col fade-in">
            <div class="text-center mb-8">
                <p class="text-slate-500 text-lg">Aplica tus conocimientos sobre orientación aromática y mecanismos de reacción. Selecciona tu nivel.</p>
            </div>
            
            <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4" id="levels-grid">
                </div>
        </div>

        <div id="syn-level-view" class="hidden flex-grow flex-col h-full fade-in">
            <button onclick="showMenu()" class="mb-4 text-emerald-600 font-bold hover:text-emerald-800 flex items-center gap-2 self-start bg-emerald-50 hover:bg-emerald-100 transition-colors px-4 py-2 rounded-lg border border-emerald-200">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
                Abandonar Experimento
            </button>
            
            <div class="bg-white rounded-2xl shadow-soft border border-slate-200 p-6 flex-grow flex flex-col">
                <div class="flex justify-between items-center border-b border-slate-100 pb-4 mb-4">
                    <h2 id="syn-level-title" class="text-xl font-bold text-slate-800">Nivel X</h2>
                    <span id="syn-progress" class="text-sm font-bold text-emerald-600 bg-emerald-50 px-3 py-1 rounded-full border border-emerald-200">
                        Modo Secuencia Libre
                    </span>
                </div>

                <div class="mb-6 bg-slate-50 p-5 rounded-xl border border-slate-200 shadow-inner">
                    <p class="text-xs text-slate-500 font-bold uppercase tracking-wider mb-1">Objetivo Sintético:</p>
                    <p id="syn-target" class="text-2xl font-bold text-emerald-700 mb-5"></p>
                    
                    <p class="text-xs text-slate-500 font-bold uppercase tracking-wider mb-2">Ruta en Construcción:</p>
                    <div id="syn-path" class="flex flex-wrap gap-2 items-center text-sm font-medium text-slate-700">
                        </div>
                </div>

                <div id="syn-interaction-area" class="flex-grow flex flex-col">
                    <p class="text-sm font-semibold text-slate-600 mb-4 text-center uppercase tracking-wide border-b border-slate-100 pb-2">Estantería de Reactivos</p>
                    <div id="reagents-container" class="reagents-grid mb-6">
                        </div>
                </div>

                <div id="syn-feedback" class="mt-auto hidden p-4 rounded-xl text-center text-md shadow-sm"></div>
                
                <button id="syn-next-btn" onclick="showMenu()" class="mt-6 hidden mx-auto bg-emerald-600 text-white hover:bg-emerald-700 py-3 px-8 rounded-xl font-bold transition-colors shadow-md w-full sm:w-auto">
                    Reto Superado - Volver al Menú
                </button>
            </div>
        </div>

    </div>

    <script>
        // --- ESTANTERÍA UNIVERSAL DE REACTIVOS (16 OPCIONES PARA TODOS LOS NIVELES) ---
        const MASTER_REAGENTS = [
            "HNO<sub>3</sub> / H<sub>2</sub>SO<sub>4</sub>",
            "SO<sub>3</sub> / H<sub>2</sub>SO<sub>4</sub>",
            "Cl<sub>2</sub> / AlCl<sub>3</sub>",
            "Br<sub>2</sub> / FeBr<sub>3</sub>",
            "CH<sub>3</sub>Cl / AlCl<sub>3</sub>",
            "CH<sub>3</sub>CH<sub>2</sub>Cl / AlCl<sub>3</sub>",
            "CH<sub>3</sub>COCl / AlCl<sub>3</sub>",
            "KMnO<sub>4</sub> / Calor",
            "NaBH<sub>4</sub> o LiAlH<sub>4</sub>",
            "Br<sub>2</sub> / Luz (h&nu;)",
            "EtO<sup>-</sup>Na<sup>+</sup> / Calor",
            "Mg / Éter seco",
            "Epóxido + H<sub>2</sub>O",
            "HCHO + H<sub>2</sub>O",
            "CH<sub>3</sub>CH<sub>2</sub>MgCl + H<sub>2</sub>O",
            "H<sub>2</sub>O / H<sup>+</sup>"
        ];

        // --- BASE DE DATOS DE 20 NIVELES PROGRESIVOS ---
        const levels = [
            // BLOQUE 1: ORIENTACIONES BÁSICAS (2 Pasos)
            {
                id: 1, title: "Nivel 1: Orientación Para", target: "p-Clorotolueno",
                correctSequence: ["CH<sub>3</sub>Cl / AlCl<sub>3</sub>", "Cl<sub>2</sub> / AlCl<sub>3</sub>"],
                intermediates: ["Tolueno (Dirige o/p)", "p-Clorotolueno"]
            },
            {
                id: 2, title: "Nivel 2: Orientación Meta", target: "m-Cloronitrobenceno",
                correctSequence: ["HNO<sub>3</sub> / H<sub>2</sub>SO<sub>4</sub>", "Cl<sub>2</sub> / AlCl<sub>3</sub>"],
                intermediates: ["Nitrobenceno (Dirige meta)", "m-Cloronitrobenceno"]
            },
            {
                id: 3, title: "Nivel 3: La Excepción Halógena", target: "p-Bromonitrobenceno",
                correctSequence: ["Br<sub>2</sub> / FeBr<sub>3</sub>", "HNO<sub>3</sub> / H<sub>2</sub>SO<sub>4</sub>"],
                intermediates: ["Bromobenceno (Desactiva pero dirige o/p)", "p-Bromonitrobenceno"]
            },
            {
                id: 4, title: "Nivel 4: Ácidos y Sulfuros", target: "Ácido m-bencenosulfónico",
                correctSequence: ["CH<sub>3</sub>Cl / AlCl<sub>3</sub>", "KMnO<sub>4</sub> / Calor", "SO<sub>3</sub> / H<sub>2</sub>SO<sub>4</sub>"],
                intermediates: ["Tolueno", "Ácido Benzoico (Dirige meta)", "Ácido m-sulfobenzoico"]
            },
            {
                id: 5, title: "Nivel 5: Prioridad de Cadena", target: "p-Etilacetofenona",
                correctSequence: ["CH<sub>3</sub>CH<sub>2</sub>Cl / AlCl<sub>3</sub>", "CH<sub>3</sub>COCl / AlCl<sub>3</sub>"],
                intermediates: ["Etilbenceno (Dirige o/p)", "p-Etilacetofenona"]
            },

            // BLOQUE 2: CAMBIOS DE ORIENTADOR EN RUTA (3 Pasos)
            {
                id: 6, title: "Nivel 6: Engaño Meta-Para", target: "Ácido p-bromobenzoico",
                correctSequence: ["CH<sub>3</sub>Cl / AlCl<sub>3</sub>", "Br<sub>2</sub> / FeBr<sub>3</sub>", "KMnO<sub>4</sub> / Calor"],
                intermediates: ["Tolueno (Dirige o/p)", "p-Bromotolueno", "Ácido p-bromobenzoico"]
            },
            {
                id: 7, title: "Nivel 7: Inversión Para-Meta", target: "Ácido m-bromobenzoico",
                correctSequence: ["CH<sub>3</sub>Cl / AlCl<sub>3</sub>", "KMnO<sub>4</sub> / Calor", "Br<sub>2</sub> / FeBr<sub>3</sub>"],
                intermediates: ["Tolueno", "Ácido Benzoico (Dirige meta)", "Ácido m-bromobenzoico"]
            },
            {
                id: 8, title: "Nivel 8: Reducción Selectiva", target: "1-Feniletanol",
                correctSequence: ["CH<sub>3</sub>COCl / AlCl<sub>3</sub>", "NaBH<sub>4</sub> o LiAlH<sub>4</sub>"],
                intermediates: ["Acetofenona", "1-Feniletanol"]
            },
            {
                id: 9, title: "Nivel 9: Combinación Meta/Orto", target: "1-(m-nitrufenil)etanol",
                correctSequence: ["CH<sub>3</sub>COCl / AlCl<sub>3</sub>", "HNO<sub>3</sub> / H<sub>2</sub>SO<sub>4</sub>", "NaBH<sub>4</sub> o LiAlH<sub>4</sub>"],
                intermediates: ["Acetofenona (Dirige meta)", "m-Nitroacetofenona", "1-(m-nitrufenil)etanol"]
            },
            {
                id: 10, title: "Nivel 10: Oxidación Agresiva", target: "Ácido p-nitrobenzoico",
                correctSequence: ["CH<sub>3</sub>Cl / AlCl<sub>3</sub>", "HNO<sub>3</sub> / H<sub>2</sub>SO<sub>4</sub>", "KMnO<sub>4</sub> / Calor"],
                intermediates: ["Tolueno (Dirige o/p)", "p-Nitrotolueno", "Ácido p-nitrobenzoico"]
            },

            // BLOQUE 3: RADICALES Y ALQUENOS (3-4 Pasos)
            {
                id: 11, title: "Nivel 11: Síntesis de Estireno", target: "Estireno (Etenilbenceno)",
                correctSequence: ["CH<sub>3</sub>CH<sub>2</sub>Cl / AlCl<sub>3</sub>", "Br<sub>2</sub> / Luz (h&nu;)", "EtO<sup>-</sup>Na<sup>+</sup> / Calor"],
                intermediates: ["Etilbenceno", "1-bromo-1-feniletano", "Estireno"]
            },
            {
                id: 12, title: "Nivel 12: Halogenación Bencílica", target: "1-bromo-1-(p-clorofenil)etano",
                correctSequence: ["CH<sub>3</sub>CH<sub>2</sub>Cl / AlCl<sub>3</sub>", "Cl<sub>2</sub> / AlCl<sub>3</sub>", "Br<sub>2</sub> / Luz (h&nu;)"],
                intermediates: ["Etilbenceno", "p-Cloroetilbenceno", "1-bromo-1-(p-clorofenil)etano"]
            },
            {
                id: 13, title: "Nivel 13: Examen (Reto Etenil)", target: "3-Etenil nitrobenceno (m-nitroestireno)",
                correctSequence: ["HNO<sub>3</sub> / H<sub>2</sub>SO<sub>4</sub>", "CH<sub>3</sub>CH<sub>2</sub>Cl / AlCl<sub>3</sub>", "Br<sub>2</sub> / Luz (h&nu;)", "EtO<sup>-</sup>Na<sup>+</sup> / Calor"],
                intermediates: ["Nitrobenceno", "m-Etilnitrobenceno", "1-bromo-1-(m-nitrofenil)etano", "3-Etenil nitrobenceno"]
            },
            {
                id: 14, title: "Nivel 14: Estireno Sustituido", target: "p-Cloroestireno",
                correctSequence: ["CH<sub>3</sub>CH<sub>2</sub>Cl / AlCl<sub>3</sub>", "Cl<sub>2</sub> / AlCl<sub>3</sub>", "Br<sub>2</sub> / Luz (h&nu;)", "EtO<sup>-</sup>Na<sup>+</sup> / Calor"],
                intermediates: ["Etilbenceno", "p-Cloroetilbenceno", "1-bromo-1-(p-clorofenil)etano", "p-Cloroestireno"]
            },
            {
                id: 15, title: "Nivel 15: Hidratación Markovnikov", target: "1-Feniletanol (Alternativa)",
                correctSequence: ["CH<sub>3</sub>CH<sub>2</sub>Cl / AlCl<sub>3</sub>", "Br<sub>2</sub> / Luz (h&nu;)", "EtO<sup>-</sup>Na<sup>+</sup> / Calor", "H<sub>2</sub>O / H<sup>+</sup>"],
                intermediates: ["Etilbenceno", "1-bromo-1-feniletano", "Estireno", "1-Feniletanol"]
            },

            // BLOQUE 4: QUÍMICA ORGANOMETÁLICA Y EXÁMENES (3-4 Pasos)
            {
                id: 16, title: "Nivel 16: Preparando Grignard", target: "Bromuro de fenilmagnesio",
                correctSequence: ["Br<sub>2</sub> / FeBr<sub>3</sub>", "Mg / Éter seco"],
                intermediates: ["Bromobenceno", "Bromuro de fenilmagnesio"]
            },
            {
                id: 17, title: "Nivel 17: Alargamiento de Cadena", target: "2-Feniletanol",
                correctSequence: ["Br<sub>2</sub> / FeBr<sub>3</sub>", "Mg / Éter seco", "Epóxido + H<sub>2</sub>O"],
                intermediates: ["Bromobenceno", "Bromuro de fenilmagnesio", "2-Feniletanol"]
            },
            {
                id: 18, title: "Nivel 18: Alcohol Primario Base", target: "Alcohol bencílico",
                correctSequence: ["Br<sub>2</sub> / FeBr<sub>3</sub>", "Mg / Éter seco", "HCHO + H<sub>2</sub>O"],
                intermediates: ["Bromobenceno", "Bromuro de fenilmagnesio", "Alcohol bencílico"]
            },
            {
                id: 19, title: "Nivel 19: Examen (Avanzado)", target: "2-(4-etilfenil)-2-butanol",
                correctSequence: ["CH<sub>3</sub>CH<sub>2</sub>Cl / AlCl<sub>3</sub>", "CH<sub>3</sub>COCl / AlCl<sub>3</sub>", "CH<sub>3</sub>CH<sub>2</sub>MgCl + H<sub>2</sub>O"],
                intermediates: ["Etilbenceno (Dirige o/p)", "p-Etilacetofenona", "2-(4-etilfenil)-2-butanol"]
            },
            {
                id: 20, title: "Nivel 20: Síntesis Total", target: "Ácido 3-nitro-5-bromobenzoico",
                correctSequence: ["CH<sub>3</sub>Cl / AlCl<sub>3</sub>", "KMnO<sub>4</sub> / Calor", "HNO<sub>3</sub> / H<sub>2</sub>SO<sub>4</sub>", "Br<sub>2</sub> / FeBr<sub>3</sub>"],
                intermediates: ["Tolueno", "Ácido Benzoico", "Ácido m-nitrobenzoico", "Ácido 3-nitro-5-bromobenzoico"]
            }
        ];

        let currentLevelIndex = 0;
        let seqStep = 0;
        let synPath = ["Benceno"];

        document.addEventListener('DOMContentLoaded', () => {
            renderLevelMenu();
        });

        // --- RENDERIZADO DEL MENÚ DE NIVELES ---
        function renderLevelMenu() {
            const grid = document.getElementById('levels-grid');
            grid.innerHTML = '';
            
            levels.forEach((lvl, index) => {
                let difficultyColor = "border-emerald-200 text-emerald-700 bg-emerald-50";
                if (index > 4) difficultyColor = "border-blue-200 text-blue-700 bg-blue-50";
                if (index > 9) difficultyColor = "border-orange-200 text-orange-700 bg-orange-50";
                if (index > 14) difficultyColor = "border-purple-200 text-purple-700 bg-purple-50";

                grid.innerHTML += `
                    <button onclick="startLevel(${index})" class="flex flex-col text-left p-4 rounded-xl shadow-sm border-2 border-slate-200 bg-white hover:border-slate-400 transition-all group">
                        <span class="text-xs font-bold uppercase tracking-wider mb-2 px-2 py-1 rounded border ${difficultyColor}">
                            ${lvl.title.split(':')[0]}
                        </span>
                        <span class="text-md font-bold text-slate-800 group-hover:text-emerald-600 transition-colors leading-tight">
                            ${lvl.target}
                        </span>
                    </button>
                `;
            });
        }

        function showMenu() {
            document.getElementById('syn-level-view').classList.add('hidden');
            document.getElementById('syn-menu-view').classList.remove('hidden');
        }

        // --- INICIO Y RENDERIZADO DEL NIVEL ---
        function startLevel(index) {
            currentLevelIndex = index;
            document.getElementById('syn-menu-view').classList.add('hidden');
            document.getElementById('syn-level-view').classList.remove('hidden');
            
            const lvl = levels[currentLevelIndex];
            document.getElementById('syn-level-title').innerText = `${lvl.title}`;
            document.getElementById('syn-target').innerHTML = lvl.target;
            
            synPath = ["Benceno"];
            seqStep = 0;
            
            renderPath();
            renderReagents();
            
            document.getElementById('syn-feedback').classList.add('hidden');
            document.getElementById('syn-next-btn').classList.add('hidden');
        }

        function renderPath() {
            const pathHtml = synPath.map((item, idx) => `
                <span class="bg-emerald-100 px-3 py-1.5 rounded border border-emerald-300 shadow-sm">${item}</span>
                ${idx < synPath.length - 1 ? '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-slate-400"><path d="m9 18 6-6-6-6"/></svg>' : ''}
            `).join('');
            document.getElementById('syn-path').innerHTML = pathHtml;
        }

        function renderReagents() {
            const container = document.getElementById('reagents-container');
            container.innerHTML = '';
            
            // Creamos una copia del array maestro y lo mezclamos para que no sea siempre igual
            let currentReagents = [...MASTER_REAGENTS];
            for (let i = currentReagents.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [currentReagents[i], currentReagents[j]] = [currentReagents[j], currentReagents[i]];
            }

            currentReagents.forEach((reagent) => {
                const btn = document.createElement('button');
                btn.className = "bg-white border-2 border-slate-200 hover:border-emerald-400 hover:bg-emerald-50 p-3 rounded-lg font-medium text-sm text-slate-700 transition-all text-center flex items-center justify-center min-h-[4.5rem] shadow-sm";
                btn.innerHTML = reagent;
                btn.onclick = () => handleSequenceClick(reagent, btn);
                container.appendChild(btn);
            });
        }

        // --- LÓGICA DE VALIDACIÓN ---
        function handleSequenceClick(reagent, buttonEl) {
            const level = levels[currentLevelIndex];
            const feedbackEl = document.getElementById('syn-feedback');
            const nextBtn = document.getElementById('syn-next-btn');
            
            // Bloqueamos los botones si el nivel ya se completó
            if (seqStep >= level.correctSequence.length) return;

            const targetReagent = level.correctSequence[seqStep];

            if (reagent === targetReagent) {
                // Acierto
                buttonEl.classList.add('bg-emerald-100', 'border-emerald-500');
                
                synPath.push(level.intermediates[seqStep]);
                renderPath();
                seqStep++;

                feedbackEl.classList.remove('hidden', 'bg-red-100', 'text-red-700', 'border-red-300');
                feedbackEl.classList.add('bg-emerald-100', 'text-emerald-800', 'border', 'border-emerald-300');
                feedbackEl.innerHTML = `✅ ¡Correcto! Has formado <b>${level.intermediates[seqStep-1]}</b>.`;

                if (seqStep === level.correctSequence.length) {
                    // Nivel superado
                    const allBtns = document.getElementById('reagents-container').querySelectorAll('button');
                    allBtns.forEach(b => { b.disabled = true; b.classList.add('opacity-50', 'cursor-not-allowed'); });
                    
                    feedbackEl.className = "mt-6 p-6 rounded-xl text-center text-xl font-bold bg-emerald-100 text-emerald-800 border-2 border-emerald-400 shadow-md"; 
                    feedbackEl.innerHTML = `🎉 ¡Síntesis Completada Exitosamente!`;
                    nextBtn.classList.remove('hidden');
                }
            } else {
                // Fallo
                buttonEl.classList.replace('border-slate-200', 'border-red-500');
                buttonEl.classList.add('bg-red-100', 'text-red-800', 'shake');
                
                feedbackEl.classList.remove('hidden', 'bg-emerald-100', 'text-emerald-800', 'border-emerald-300');
                feedbackEl.className = "mt-6 p-4 rounded-xl text-center text-md font-medium bg-red-100 text-red-700 border border-red-300";
                
                // Mensaje de error personalizado según el paso
                let errorMsg = `❌ El reactivo <b>${reagent}</b> no es el correcto en este paso.`;
                if (seqStep > 0) {
                    errorMsg += ` Fíjate en cómo orienta tu molécula actual (${level.intermediates[seqStep-1]}).`;
                }
                feedbackEl.innerHTML = errorMsg;
                
                setTimeout(() => {
                    buttonEl.classList.replace('border-red-500', 'border-slate-200');
                    buttonEl.classList.remove('bg-red-100', 'text-red-800', 'shake');
                }, 1000);
            }
        }
    </script>
</body>
</html>
